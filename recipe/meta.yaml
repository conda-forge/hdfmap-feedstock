{% set name = "hdfmap" %}
{% set version = "1.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/hdfmap-{{ version }}.tar.gz
  sha256: 14f649b09d943768ae6a831dcc468d0f265537f6d765ba7f6be9ada3a07c7cba

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61.0
    - wheel
    - pytest
    - numpy
    - h5py
    - hdf5plugin
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - h5py
    - hdf5plugin
    - asteval

test:
  imports:
    - hdfmap
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Map objects within a HDF5 file and create a dataset namespace
  home: https://github.com/DiamondLightSource/hdfmap
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - DanPorter
    - PeterC-DLS
